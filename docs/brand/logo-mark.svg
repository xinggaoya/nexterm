<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nexterm Brand Mark · logo-mark.svg
  ==================================
  用途：透明背景的纯 mark，用于 README inline 嵌入、社交分享卡、GitHub badge。
  几何与 app-icon.svg 完全一致，仅去掉圆角方框背景与外发光（透明背景时发光会发散）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Nexterm">
  <defs>
    <linearGradient id="inkGrad" x1="512" y1="212" x2="512" y2="812" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#F4F8FB"/>
      <stop offset="1" stop-color="#DDE3EA"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="712" y1="512" x2="712" y2="812" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BEF264"/>
      <stop offset="0.42" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="cursorHighlight" x1="712" y1="512" x2="712" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cursorShadow" x1="712" y1="770" x2="712" y2="812" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E7490" stop-opacity="0"/>
      <stop offset="1" stop-color="#0E7490" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="nClip">
      <rect x="262" y="212" width="100" height="600" rx="16"/>
      <path d="M 362 212 L 462 212 L 662 812 L 562 812 Z"/>
      <rect x="662" y="212" width="100" height="300" rx="16"/>
    </clipPath>
  </defs>

  <!-- N 字符 -->
  <g fill="url(#inkGrad)">
    <rect x="262" y="212" width="100" height="600" rx="16"/>
    <path d="M 362 212 L 462 212 L 662 812 L 562 812 Z"/>
    <rect x="662" y="212" width="100" height="300" rx="16"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" clip-path="url(#nClip)">
    <rect x="262" y="212" width="100" height="600" rx="16"/>
    <path d="M 362 212 L 462 212 L 662 812 L 562 812 Z"/>
    <rect x="662" y="212" width="100" height="300" rx="16"/>
  </g>

  <!-- 光标方块 -->
  <g>
    <rect x="662" y="512" width="100" height="300" rx="16" fill="url(#cursorGrad)"/>
    <rect x="666" y="516" width="92" height="68" rx="12" fill="url(#cursorHighlight)"/>
    <rect x="666" y="770" width="92" height="38" rx="10" fill="url(#cursorShadow)"/>
    <rect x="685" y="528" width="54" height="24" rx="6" fill="#FFFFFF" opacity="0.45"/>
  </g>
</svg>