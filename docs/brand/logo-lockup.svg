<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nexterm Brand Mark · logo-lockup.svg (horizontal)
  =================================================
  用途：README 标题、网站 hero、邮件签名。
  文字 fill="currentColor"，可通过 CSS `color` 控制颜色：
    <svg style="color: #F4F8FB"> → 浅色文字（深色背景）
    <svg style="color: #0A0D12"> → 深色文字（浅色背景）
  字体栈：Inter Variable → Inter → system-ui，确保跨平台一致。
  Mark 部分与 logo-mark.svg 完全一致。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1408 512" width="1408" height="512" role="img" aria-label="Nexterm">
  <defs>
    <linearGradient id="inkGrad" x1="256" y1="106" x2="256" y2="406" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="currentColor"/>
      <stop offset="0.45" stop-color="currentColor"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="356" y1="256" x2="356" y2="406" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BEF264"/>
      <stop offset="0.42" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="cursorHighlight" x1="356" y1="256" x2="356" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cursorShadow" x1="356" y1="385" x2="356" y2="406" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E7490" stop-opacity="0"/>
      <stop offset="1" stop-color="#0E7490" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="nClip">
      <rect x="131" y="106" width="50" height="300" rx="8"/>
      <path d="M 181 106 L 231 106 L 331 406 L 281 406 Z"/>
      <rect x="331" y="106" width="50" height="150" rx="8"/>
    </clipPath>
  </defs>

  <!-- Mark（缩放到 0.5 倍：131→0.5*262, 106→0.5*212, etc.） -->
  <g fill="url(#inkGrad)">
    <rect x="131" y="106" width="50" height="300" rx="8"/>
    <path d="M 181 106 L 231 106 L 331 406 L 281 406 Z"/>
    <rect x="331" y="106" width="50" height="150" rx="8"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-opacity="0.14" stroke-width="1" clip-path="url(#nClip)">
    <rect x="131" y="106" width="50" height="300" rx="8"/>
    <path d="M 181 106 L 231 106 L 331 406 L 281 406 Z"/>
    <rect x="331" y="106" width="50" height="150" rx="8"/>
  </g>

  <!-- 光标方块 -->
  <g>
    <rect x="331" y="256" width="50" height="150" rx="8" fill="url(#cursorGrad)"/>
    <rect x="333" y="258" width="46" height="34" rx="6" fill="url(#cursorHighlight)"/>
    <rect x="333" y="385" width="46" height="19" rx="5" fill="url(#cursorShadow)"/>
    <rect x="342" y="264" width="27" height="12" rx="3" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- Wordmark：自适应颜色 (currentColor) -->
  <text x="456" y="346"
        font-family="'Inter Variable', 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="288"
        font-weight="700"
        letter-spacing="-14"
        fill="currentColor">Nexterm</text>
</svg>