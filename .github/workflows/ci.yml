name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 默认收紧：只有需要写内容的 job 才单独提权（发版在 release.yml 里另有
# contents: write）。没写明权限的 job 默认是只读的。
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 两个 lockfile 各自浮动，Rust 侧的 tauri crate 可能先跑到下一个 minor，
      # 而 npm 侧的 @tauri-apps/api 没跟上 —— Tauri CLI 会在 `tauri build`
      # 时直接失败。CI 跑的是 `pnpm build`（不经过 CLI），所以这道检查必须
      # 单独存在，否则漂移只能等发版才暴露（v0.3.0 就这么炸过一次）。
      - name: Check Tauri package version sync
        run: ./.github/scripts/check-tauri-version-sync.sh

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` 的第一道就是 `vue-tsc --noEmit`，这里不再单独跑一遍
      # （那会白付一次全量类型检查的几十秒）。
      - name: Unit tests
        run: pnpm test

      - name: Build (includes vue-tsc typecheck)
        run: pnpm build

      - name: Fail on dirty git tree
        run: git diff --exit-code

  frontend-macos:
    name: Frontend smoke (macOS)
    # release.yml 会构建 universal-apple-darwin，但 macOS 专属代码路径
    # （pty shell init、Option 键修饰、字体探测、cfg(target_os="macos") 依赖）
    # 此前只有在发版当天才会被编译一次。这里给一个提前两周的廉价预警。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-22.04
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev

      # CI 容器是 fresh environment,第一次 cargo build 会 fetch 最新
      # crates.io index。若某个 dep 在 lock file 记录后被 yank / 重新发布
      # (checksum 变化),--locked 会拒绝更新,导致 CI 假红。
      # 主 release build (release.yml) 仍走 --locked 保证发布物可复现;
      # CI 接受 lock file 跟当前 index 自动 reconcile。
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check --all-targets

      # CrabNebula 后端插桩是可选 feature（默认关闭）。默认路径检查不到它，
      # 所以单独跑一次，免得 opt-in 构建悄悄坏掉。
      - name: cargo check (crabnebula-devtools feature)
        run: cargo check --all-targets --features crabnebula-devtools

      # 浏览器调试桥同样是可选 feature（默认关闭）。它走 git 依赖，
      # 默认路径不会编译它 —— 单独跑一次，免得 opt-in 构建悄悄坏掉。
      - name: cargo check (web-dev-bridge feature)
        run: cargo check --all-targets --features web-dev-bridge

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # cargo audit **不是 rustup 的内置组件** —— 不装的话下面那句
      # `cargo audit` 会直接报 "no such command: `audit`"，job 变红，
      # 却从来没真的审过任何东西（这个洞存在了很久）。
      #
      # 从 crates.io 装（而不是引入第三方 Action）：审计工具本身也在供应链里，
      # 不该为它新增一个 GitHub Action 依赖。锁死版本 + --locked 保证可复现。
      - name: Install cargo-audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --version

      # scripts/audit.sh 以 src-tauri/audit.toml 为唯一事实来源读取豁免清单
      # （cargo-audit 0.22 的配置文件发现在不同环境下不一致，所以不依赖它）。
      # 每条豁免都必须在 audit.toml 里写明判断依据，review 时看得见。
      - name: cargo audit
        working-directory: src-tauri
        run: ./scripts/audit.sh

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 全部前端 audit 告警目前都是构建期传递依赖（postcss / nanoid /
      # source-map-js 经 vue 的 compiler-sfc 进入），不会进 webview bundle。
      # 这条先做「可见」不做「阻断」，等传递依赖升到修复线再改成硬门禁 ——
      # 一上线就红只会让人学会忽略它。
      - name: JS audit (advisory)
        run: pnpm audit --audit-level high || echo "::warning::JS audit findings above"
