name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 默认收紧：只有需要写内容的 job 才单独提权（发版在 release.yml 里另有
# contents: write）。没写明权限的 job 默认是只读的。
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` 的第一道就是 `vue-tsc --noEmit`，这里不再单独跑一遍
      # （那会白付一次全量类型检查的几十秒）。
      - name: Unit tests
        run: pnpm test

      - name: Build (includes vue-tsc typecheck)
        run: pnpm build

      - name: Fail on dirty git tree
        run: git diff --exit-code

  frontend-macos:
    name: Frontend smoke (macOS)
    # release.yml 会构建 universal-apple-darwin，但 macOS 专属代码路径
    # （pty shell init、Option 键修饰、字体探测、cfg(target_os="macos") 依赖）
    # 此前只有在发版当天才会被编译一次。这里给一个提前两周的廉价预警。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-22.04
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev

      # CI 容器是 fresh environment,第一次 cargo build 会 fetch 最新
      # crates.io index。若某个 dep 在 lock file 记录后被 yank / 重新发布
      # (checksum 变化),--locked 会拒绝更新,导致 CI 假红。
      # 主 release build (release.yml) 仍走 --locked 保证发布物可复现;
      # CI 接受 lock file 跟当前 index 自动 reconcile。
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # scripts/audit.sh 以 src-tauri/audit.toml 为唯一事实来源读取豁免清单
      # （cargo-audit 0.22 的配置文件发现在不同环境下不一致，所以不依赖它）。
      # 每条豁免都必须在 audit.toml 里写明判断依据，review 时看得见。
      - name: cargo audit
        working-directory: src-tauri
        run: ./scripts/audit.sh

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 全部前端 audit 告警目前都是构建期传递依赖（postcss / nanoid /
      # source-map-js 经 vue 的 compiler-sfc 进入），不会进 webview bundle。
      # 这条先做「可见」不做「阻断」，等传递依赖升到修复线再改成硬门禁 ——
      # 一上线就红只会让人学会忽略它。
      - name: JS audit (advisory)
        run: pnpm audit --audit-level high || echo "::warning::JS audit findings above"
