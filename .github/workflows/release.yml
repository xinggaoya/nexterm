name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # nexterm-agent 编译为 musl 静态二进制,需要 musl 工具链;
  # Windows runner 默认是 MinGW(ld 不支持 musl 链接选项),
  # macOS runner 是系统 ld(不支持 GNU 链接选项),
  # 只有 Ubuntu runner 自带 musl 工具链能完成 cross-compile。
  # 因此 agent 收敛到一个独立的 ubuntu job,产物通过 artifact
  # 共享给后续三个平台的 tauri bundle 步骤嵌入。
  agent:
    name: Build musl agent
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install musl build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            musl-tools \
            patchelf

      # 注意:此步骤不带 --locked。musl cross-compile 引入
      # platform-specific 解析(linux-raw-sys / rustix / ring 等),
      # CI runner 是 fresh container,cargo 首次 fetch crates.io index
      # 时可能发现 lock file 校验不一致(某个 dep 被 yank/重发后 checksum 变化)。
      # 主 build (Tauri bundle) 仍走 --locked 保持锁版本。
      - name: Build nexterm-agent (x86_64-unknown-linux-musl)
        working-directory: src-tauri
        run: cargo build --release --target x86_64-unknown-linux-musl -p nexterm-agent

      - name: Verify agent asset
        run: test -f src-tauri/target/x86_64-unknown-linux-musl/release/nexterm-agent

      - uses: actions/upload-artifact@v4
        with:
          name: nexterm-agent-musl
          path: src-tauri/target/x86_64-unknown-linux-musl/release/nexterm-agent
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: agent
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ""
          - name: Ubuntu
            platform: ubuntu-22.04
            args: ""
          - name: macOS
            platform: macos-latest
            args: "--target universal-apple-darwin"
            rustTargets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rustTargets != ''
        with:
          targets: ${{ matrix.rustTargets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 把 agent job 产出的 musl 静态二进制放到 build.rs 默认探测路径,
      # 这样 build.rs 即使不显式传入 NEXTERM_AGENT 环境变量也能找到。
      - uses: actions/download-artifact@v4
        with:
          name: nexterm-agent-musl
          path: src-tauri/target/x86_64-unknown-linux-musl/release/

      - name: Verify agent asset
        run: test -f src-tauri/target/x86_64-unknown-linux-musl/release/nexterm-agent

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@action-v0.5.25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXTERM_AGENT: ${{ github.workspace }}/src-tauri/target/x86_64-unknown-linux-musl/release/nexterm-agent
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Nexterm ${{ github.ref_name }}
          releaseBody: "自动构建的 Nexterm 桌面安装包，支持应用内自动更新。"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}