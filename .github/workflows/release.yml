name: Release

on:
  push:
    tags:
      - "v*"

# 同一 tag 的多次 push 不取消正在运行的 workflow(避免 release 半成品状态)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # nexterm-agent 编译为 musl 静态二进制,需要 musl 工具链;
  # Windows runner 默认是 MinGW(ld 不支持 musl 链接选项),
  # macOS runner 是系统 ld(不支持 GNU 链接选项),
  # 只有 Ubuntu runner 自带 musl 工具链能完成 cross-compile。
  # 因此 agent 收敛到一个独立的 ubuntu job,产物通过 artifact
  # 共享给后续三个平台的 tauri bundle 步骤嵌入。
  agent:
    name: Build musl agent
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install musl build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            musl-tools \
            patchelf

      # 注意:此步骤不带 --locked。musl cross-compile 引入
      # platform-specific 解析(linux-raw-sys / rustix / ring 等),
      # CI runner 是 fresh container,cargo 首次 fetch crates.io index
      # 时可能发现 lock file 校验不一致(某个 dep 被 yank/重发后 checksum 变化)。
      # 主 build (Tauri bundle) 仍走 --locked 保持锁版本。
      - name: Build nexterm-agent (x86_64-unknown-linux-musl)
        working-directory: src-tauri
        run: cargo build --release --target x86_64-unknown-linux-musl -p nexterm-agent

      - name: Verify agent asset
        run: test -f src-tauri/target/x86_64-unknown-linux-musl/release/nexterm-agent

      - uses: actions/upload-artifact@v6
        with:
          name: nexterm-agent-musl
          path: src-tauri/target/x86_64-unknown-linux-musl/release/nexterm-agent
          if-no-files-found: error

  # 提前创建 draft release,让三平台 build job 都能用 releaseId 模式
  # 把产物追加到同一 release。tauri-action@v1 在 releaseId 模式下会
  # 自动跨 jobs 合并 latest.json 的 platforms 段,避免 main 分支
  # fallback 文件因 ubuntu 先完成而过早写入。
  create-release:
    name: Create draft release
    needs: agent
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" \
            --draft \
            --title "Nexterm $TAG_NAME" \
            --notes "Release build in progress. This draft will be published once all platform builds succeed."

      - name: Capture release ID
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_ID=$(gh release view "$TAG_NAME" --json databaseId -q '.databaseId')
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Created release $TAG_NAME with id $RELEASE_ID"
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}

  build:
    name: Build ${{ matrix.name }}
    needs: [agent, create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ""
          - name: Ubuntu
            platform: ubuntu-22.04
            args: ""
          - name: macOS
            platform: macos-latest
            args: "--target universal-apple-darwin"
            rustTargets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rustTargets != ''
        with:
          targets: ${{ matrix.rustTargets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 把 agent job 产出的 musl 静态二进制放到 build.rs 默认探测路径,
      # 这样 build.rs 即使不显式传入 NEXTERM_AGENT 环境变量也能找到。
      - uses: actions/download-artifact@v7
        with:
          name: nexterm-agent-musl
          path: src-tauri/target/x86_64-unknown-linux-musl/release/

      - name: Verify agent asset
        run: test -f src-tauri/target/x86_64-unknown-linux-musl/release/nexterm-agent

      # tauri-action@v1:releaseId 模式下,action 会从已有 release 中读出
      # latest.json,把当前平台的 platforms 段合并进去再上传覆盖,
      # 跨 jobs 自动汇总所有平台的 updater 元数据。
      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXTERM_AGENT: ${{ github.workspace }}/src-tauri/target/x86_64-unknown-linux-musl/release/nexterm-agent
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # 三平台构建全部成功后,做收尾工作:
  # 1. 从 CHANGELOG.md 抽取对应版本的说明替换 draft 的 notes
  # 2. 把 release 从 draft 改为 published
  # 3. 同步 Cargo.lock 回 main(避免后续 CI 跑 cargo check --locked 假红)
  # 4. 同步 latest.json 到 main 分支 fallback 路径(覆盖 CDN 边缘节点 404)
  publish:
    name: Publish release and sync fallbacks
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Publish release with CHANGELOG notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          echo "Extracting CHANGELOG section for ${VERSION}..."

          # 从 CHANGELOG.md 抽取 ## [VERSION] - DATE 段,直到下一个 ## [ 段
          NOTES=$(awk -v ver="[${VERSION}]" '
            BEGIN { capturing = 0 }
            /^## \[/ {
              if ($0 ~ ver) { capturing = 1; print; next }
              if (capturing) { exit }
            }
            capturing { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG section found for ${VERSION}, falling back to short notes"
            NOTES="## Nexterm ${TAG_NAME}

自动构建的 Nexterm 桌面安装包,支持应用内自动更新。

完整变更说明参见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${TAG_NAME}/CHANGELOG.md)。"
          fi

          # 附加下载表格
          NOTES="${NOTES}

### 下载

| 平台 | 包 |
| --- | --- |
| Windows | \`.exe\` (NSIS) · \`.msi\` |
| macOS | \`.dmg\` (universal) · \`.app.tar.gz\` |
| Linux | \`.deb\` · \`.rpm\` · \`.AppImage\` |

所有产物已使用 Tauri 私钥签名,客户端会通过内置公钥验证更新来源。"

          gh release edit "$TAG_NAME" \
            --draft=false \
            --notes "$NOTES"

      # tauri build 可能在 release 过程中接收 crates.io index 中某个 dep
      # 的重新发布 (checksum 变化),导致 Cargo.lock 被自动更新。把更新的
      # Cargo.lock 提交到 main,避免后续 push 触发的 CI 跑 cargo check
      # --locked 时遇到 stale lock file 假红。
      # commit message 含 [skip ci] 不重复触发 ci.yml。
      # 收敛到 publish job,避免三平台并发 push 冲突。
      - name: Commit Cargo.lock refresh
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock unchanged, skipping commit"
            exit 0
          fi
          git add src-tauri/Cargo.lock
          git commit -m "chore(lock): refresh Cargo.lock after ${{ github.ref_name }} release [skip ci]"
          git push origin HEAD:main

      # GitHub Release asset CDN 在某些网络位置偶尔会返回 404(边缘节点 stale),
      # tauri-plugin-updater 走到 ReleaseNotFound 分支会抛出
      # "Could not fetch a valid release JSON from the remote" 错误。
      # 把 latest.json 同步到 main 分支的固定路径,作为 fallback endpoint
      # (tauri.conf.json 已把 raw.githubusercontent.com 列为备用 endpoint)。
      # 收敛到 publish job,保证此时三个平台都已上传完成,latest.json 是完整的。
      - name: Sync latest.json to main branch fallback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Fetching latest.json content from release asset API..."
          ASSET_API_URL=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG_NAME" \
            | jq -r '.assets[] | select(.name=="latest.json") | .url')
          if [ -z "$ASSET_API_URL" ] || [ "$ASSET_API_URL" = "null" ]; then
            echo "::warning::latest.json asset not found in release $TAG_NAME, skipping sync"
            exit 0
          fi
          CONTENT_BASE64=$(curl -sL \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$ASSET_API_URL" \
            | base64 -w 0)
          EXISTING_SHA=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/updates/latest.json?ref=main" \
            | jq -r '.sha // empty')
          PAYLOAD=$(jq -n \
            --arg msg "chore(release): sync latest.json for $TAG_NAME [skip ci]" \
            --arg content "$CONTENT_BASE64" \
            --arg branch "main" \
            --arg sha "$EXISTING_SHA" \
            '{message: $msg, content: $content, branch: $branch}
             + (if $sha != "" then {sha: $sha} else {} end)')
          HTTP_STATUS=$(curl -s -o /tmp/sync-response.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/${{ github.repository }}/contents/updates/latest.json")
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
            echo "latest.json synced to main branch (status $HTTP_STATUS)"
          else
            echo "::error::Failed to sync latest.json (status $HTTP_STATUS)"
            cat /tmp/sync-response.json
            exit 1
          fi
