<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexterm</title>
    <script>
      // Pre-paint theme + borderless chrome BEFORE any module loads so the very
      // first composited frame already has the correct background and rounded
      // #root, avoiding a black/white rectangular flash on the transparent
      // Windows/Linux window. Mirrors platform.ts: borderless on non-mac when
      // running inside Tauri. globals.css html[data-chrome="borderless"] then
      // makes html/body transparent with #root as the solid rounded surface.
      (function () {
        try {
          var docEl = document.documentElement;
          var t = localStorage.getItem("nexterm-ui-theme-shadow");
          var resolved =
            t === "light" || t === "dark"
              ? t
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          docEl.classList.add(resolved);
          var bg = resolved === "dark" ? "#0a0a0a" : "#ffffff";
          docEl.style.backgroundColor = bg;
          // Match platform.ts: USE_CUSTOM_WINDOW_CONTROLS = !IS_MAC && has
          // platform. navigator.userAgent is the only signal available here.
          var isMac =
            navigator.userAgent.indexOf("Mac") !== -1 &&
            navigator.userAgent.indexOf("Win") === -1;
          if (!isMac && window.__TAURI_INTERNALS__) {
            docEl.dataset.chrome = "borderless";
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div id="terminal"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
