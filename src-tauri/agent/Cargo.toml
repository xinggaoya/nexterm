[package]
name = "nexterm-agent"
version = "0.2.2"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Nexterm resident agent for WSL/remote fs and exec via stdio JSON-lines."
repository = "https://github.com/xinggaoya/nexterm"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
notify = "8.2"
tempfile = "3"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
globset = "0.4"
# 与宿主共用搬运语义，避免第三次 copy_dir_recursive 漂移。
nexterm-fs-core = { path = "../fs-core" }

[lib]
name = "nexterm_agent"
path = "src/lib.rs"

[[bin]]
name = "nexterm-agent"
path = "src/main.rs"
