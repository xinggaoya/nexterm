<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>饮食计划编辑器 · Diet Plan Editor</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Editable cell */
  .editable {
    min-height: 44px;
    padding: 10px 14px;
    cursor: text;
    transition: background 120ms ease, box-shadow 120ms ease;
    outline: none;
    user-select: text;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .editable:hover { background: #f8fafc; }
  .editable:focus {
    background: #ffffff;
    box-shadow: inset 0 0 0 2px #10b981;
  }
  .editable:empty::before {
    content: attr(data-placeholder);
    color: #cbd5e1;
  }

  /* Plan table */
  .plan-table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    background: #ffffff;
    table-layout: auto;
  }
  .plan-table th, .plan-table td {
    border-bottom: 1px solid #e2e8f0;
    border-right: 1px solid #e2e8f0;
    vertical-align: middle;
    text-align: center;
    padding: 0;
  }
  .plan-table th:last-child, .plan-table td:last-child { border-right: none; }
  .plan-table tbody tr:last-child > td { border-bottom: none; }
  .plan-table thead th {
    background: #f1f5f9;
    font-weight: 600;
    color: #334155;
    font-size: 14px;
  }

  /* Time column */
  .section-time {
    background: linear-gradient(180deg, #ecfdf5 0%, #f0fdfa 100%);
    color: #047857;
    font-weight: 600;
    min-width: 90px;
    padding: 10px 12px;
  }

  /* Sidebar item */
  .plan-item { transition: background 120ms ease, color 120ms ease; }
  .plan-item.active { background: #ecfdf5; color: #047857; }
  .plan-item.active .plan-del { color: #6ee7b7; }
  .plan-item:not(.active):hover { background: #f8fafc; }
  .plan-item .plan-del { opacity: 0; transition: opacity 120ms ease, color 120ms ease; }
  .plan-item:hover .plan-del { opacity: 1; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* Row hover action visibility */
  .row-action { opacity: 0; transition: opacity 120ms ease, color 120ms ease; }
  tr:hover .row-action { opacity: 1; }

  /* Print */
  @media print {
    @page { size: A4; margin: 12mm; }
    html, body { height: auto; overflow: visible; background: white; }
    #app { display: block; height: auto; }
    header, aside, .no-print { display: none !important; }
    main { padding: 0 !important; overflow: visible !important; }
    .plan-table { box-shadow: none; border: 1px solid #000; }
    .plan-table th, .plan-table td { border-color: #000 !important; }
    .section-time { background: #f0f0f0 !important; color: #000 !important; }
    .editable, .editable:hover, .editable:focus { background: white !important; box-shadow: none !important; }
    a { color: inherit; text-decoration: none; }
  }
</style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden">

<div id="app" class="h-screen flex flex-col">

  <!-- ========== Header ========== -->
  <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between flex-shrink-0 no-print">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-lg flex items-center justify-center shadow-sm">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2c1.5 3 4 4.5 7 5-1 5-3 9-7 15-4-6-6-10-7-15 3-.5 5.5-2 7-5z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-base font-semibold leading-tight">饮食计划编辑器</h1>
        <p class="text-xs text-slate-500 leading-tight">在线编辑 · 自动保存 · 支持多份计划</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-new" class="px-3 py-1.5 text-sm bg-emerald-500 text-white rounded-md hover:bg-emerald-600 transition-colors shadow-sm font-medium flex items-center gap-1">
        <span class="text-base leading-none">+</span> 新建计划
      </button>
      <div class="w-px h-5 bg-slate-200 mx-1"></div>
      <button id="btn-import" class="px-3 py-1.5 text-sm bg-white border border-slate-300 rounded-md hover:bg-slate-50 transition-colors">导入</button>
      <button id="btn-export" class="px-3 py-1.5 text-sm bg-white border border-slate-300 rounded-md hover:bg-slate-50 transition-colors">导出</button>
      <button id="btn-print" class="px-3 py-1.5 text-sm bg-white border border-slate-300 rounded-md hover:bg-slate-50 transition-colors">打印</button>
    </div>
  </header>

  <!-- ========== Body ========== -->
  <div class="flex-1 flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-200 overflow-y-auto flex-shrink-0 no-print">
      <div class="p-4">
        <div class="flex items-center justify-between mb-3 px-1">
          <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider">我的计划</h2>
          <span id="plan-count" class="text-xs text-slate-400"></span>
        </div>
        <ul id="plan-list" class="space-y-1"></ul>
      </div>
      <div class="px-4 py-3 border-t border-slate-100 mt-2">
        <p class="text-xs text-slate-400 leading-relaxed">
          数据自动保存到本地浏览器。换设备或清缓存会丢失，建议定期<span class="text-emerald-600 font-medium">导出备份</span>。
        </p>
      </div>
    </aside>

    <!-- Editor -->
    <main class="flex-1 overflow-y-auto">
      <div id="editor" class="max-w-6xl mx-auto p-8"></div>
    </main>
  </div>
</div>

<input type="file" id="file-input" accept=".json" class="hidden" />

<!-- Toast -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-4 py-2 rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity z-50"></div>

<script>
"use strict";

// ============================================================
// State
// ============================================================
const STORAGE_KEY = "diet-plan-editor-v1";
let state = { plans: [], activePlanId: null };

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function defaultPlan() {
  return {
    id: uid(),
    name: "16天郭敬明剧组减肥法",
    weights: { initial: "", target: "", final: "" },
    headers: ["时间", "早餐", "午餐", "晚餐", "喝水", "空腹体重", "睡前体重"],
    sections: [
      {
        id: uid(),
        name: "3天清肠",
        rows: [
          ["", "1个鸡蛋", "1根玉米", "1根黄瓜", "2L", "", ""],
          ["", "1个鸡蛋", "1根玉米", "1根黄瓜", "2L", "", ""],
          ["", "1个鸡蛋", "1根玉米", "1根黄瓜", "2L", "", ""],
        ],
      },
      {
        id: uid(),
        name: "6天轻断食",
        rows: [
          ["", "咖啡+鸡蛋", "炒蔬菜", "西红柿", "2L", "", ""],
          ["", "咖啡+鸡蛋", "炒蔬菜", "西红柿", "2L", "", ""],
          ["", "咖啡+鸡蛋", "炒蔬菜", "西红柿", "2L", "", ""],
          ["", "咖啡+鸡蛋", "炒蔬菜", "西红柿", "2L", "", ""],
          ["", "咖啡+鸡蛋", "炒蔬菜", "西红柿", "2L", "", ""],
          ["", "咖啡+鸡蛋", "炒蔬菜", "西红柿", "2L", "", ""],
        ],
      },
      {
        id: uid(),
        name: "7天碳循环",
        rows: [
          ["", "咖啡+鸡蛋", "馒头+蔬菜", "1个火龙果", "2L", "", ""],
          ["", "玉米+鸡蛋", "蔬菜+肉", "不吃喝水", "2L", "", ""],
          ["", "南瓜+鸡蛋", "馒头+蔬菜", "1个苹果", "2L", "", ""],
          ["", "玉米+鸡蛋", "馒头+肉", "黑咖啡", "2L", "", ""],
          ["", "南瓜+鸡蛋", "馒头", "1个火龙果", "2L", "", ""],
          ["", "玉米+鸡蛋", "馒头+蔬菜", "1个苹果", "2L", "", ""],
          ["", "南瓜+鸡蛋", "馒头+肉", "1杯绿茶", "2L", "", ""],
        ],
      },
    ],
  };
}

// ============================================================
// Storage
// ============================================================
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.plans) && parsed.plans.length) {
        state = parsed;
        return;
      }
    }
  } catch (e) {
    console.warn("Failed to load state:", e);
  }
  const p = defaultPlan();
  state = { plans: [p], activePlanId: p.id };
  saveState();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error("Failed to save state:", e);
  }
}

// ============================================================
// Helpers
// ============================================================
function activePlan() {
  return state.plans.find((p) => p.id === state.activePlanId) || state.plans[0];
}
function updatePlan(fn) {
  const p = activePlan();
  if (p) { fn(p); saveState(); }
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c])
  );
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.opacity = "0"; }, 1600);
}

// ============================================================
// Render
// ============================================================
function render() {
  renderSidebar();
  renderEditor();
}

function renderSidebar() {
  const list = document.getElementById("plan-list");
  const count = document.getElementById("plan-count");
  count.textContent = state.plans.length + " 份";
  list.innerHTML = "";

  state.plans.forEach((p) => {
    const li = document.createElement("li");
    li.dataset.id = p.id;
    li.className =
      "plan-item group rounded-md px-3 py-2 cursor-pointer flex items-center justify-between " +
      (p.id === state.activePlanId ? "active" : "");
    li.innerHTML =
      '<span class="text-sm truncate flex-1" title="' + esc(p.name) + '">' +
      esc(p.name || "未命名") +
      "</span>" +
      '<button class="plan-del text-slate-400 hover:text-rose-500 flex-shrink-0 ml-2" title="删除计划">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>' +
      "</button>";
    list.appendChild(li);
  });

  list.onclick = (e) => {
    const li = e.target.closest(".plan-item");
    if (!li) return;
    if (e.target.closest(".plan-del")) {
      e.stopPropagation();
      deletePlan(li.dataset.id);
    } else {
      if (state.activePlanId === li.dataset.id) return;
      state.activePlanId = li.dataset.id;
      saveState();
      render();
    }
  };
}

function renderEditor() {
  const plan = activePlan();
  const editor = document.getElementById("editor");
  if (!plan) {
    editor.innerHTML =
      '<div class="text-center text-slate-400 py-20">未选择计划</div>';
    return;
  }
  const colCount = plan.headers.length;

  editor.innerHTML =
    // Plan name
    '<input id="plan-name" class="text-3xl font-bold w-full border-none bg-transparent ' +
    'focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500 rounded-md ' +
    'px-3 py-2 -ml-3 transition-all mb-6" ' +
    'value="' + esc(plan.name) + '" placeholder="计划名称…" />' +

    // Weight tracker
    '<div class="grid grid-cols-3 gap-4 mb-6 bg-white rounded-lg border border-slate-200 p-5">' +
    weightBlock("initial", "初始体重", plan.weights.initial) +
    weightBlock("target", "目标体重", plan.weights.target) +
    weightBlock("final", "最终体重", plan.weights.final) +
    "</div>" +

    // Table
    '<div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">' +
    '<div class="overflow-x-auto">' +
    '<table class="plan-table"><thead><tr>' +
    plan.headers
      .map(
        (h, i) =>
          '<th><div class="editable" contenteditable="true" data-placeholder="列名" data-type="header" data-col="' +
          i +
          '">' +
          esc(h) +
          "</div></th>"
      )
      .join("") +
    '<th class="w-10 no-print"></th>' +
    "</tr></thead><tbody>" +
    plan.sections.map((s) => renderSection(s, colCount)).join("") +
    "</tbody></table>" +
    "</div></div>" +

    // Action bar
    '<div class="mt-4 flex flex-wrap gap-2 no-print">' +
    '<button id="btn-add-section" class="px-3 py-1.5 text-sm text-slate-600 border border-dashed border-slate-300 rounded-md hover:border-emerald-500 hover:text-emerald-600 hover:bg-emerald-50 transition-colors">+ 添加阶段</button>' +
    '<button id="btn-add-col" class="px-3 py-1.5 text-sm text-slate-600 border border-dashed border-slate-300 rounded-md hover:border-emerald-500 hover:text-emerald-600 hover:bg-emerald-50 transition-colors">+ 添加列</button>' +
    '<button id="btn-remove-col" class="px-3 py-1.5 text-sm text-slate-600 border border-dashed border-slate-300 rounded-md hover:border-rose-500 hover:text-rose-600 hover:bg-rose-50 transition-colors">− 删除最后一列</button>' +
    '<div class="flex-1"></div>' +
    '<button id="btn-duplicate" class="px-3 py-1.5 text-sm text-slate-600 border border-slate-300 rounded-md hover:bg-slate-50 transition-colors">复制此计划</button>' +
    "</div>";

  bindEditorEvents();
}

function weightBlock(key, label, value) {
  return (
    '<div>' +
    '<label class="block text-xs font-medium text-slate-500 mb-1.5">' +
    label +
    "</label>" +
    '<input id="w-' + key + '" class="w-full text-xl font-semibold border-b-2 border-slate-200 ' +
    'focus:outline-none focus:border-emerald-500 py-1 transition-colors" ' +
    'value="' + esc(value) + '" placeholder="—" />' +
    "</div>"
  );
}

function renderSection(s, colCount) {
  let html =
    // Section header bar
    '<tr><td colspan="' + (colCount + 1) + '" class="bg-emerald-50/60 px-4 py-2.5 text-left border-b border-emerald-100/80">' +
    '<div class="flex items-center gap-2">' +
    '<span class="w-1 h-5 bg-emerald-500 rounded-full flex-shrink-0"></span>' +
    '<input class="section-name flex-1 bg-transparent font-semibold text-emerald-800 ' +
    'border-none focus:outline-none focus:bg-white focus:ring-1 focus:ring-emerald-500 ' +
    'rounded px-2 py-0.5 -ml-2 min-w-0" value="' + esc(s.name) + '" ' +
    'data-section="' + s.id + '" placeholder="阶段名称" />' +
    '<span class="section-count text-xs text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full whitespace-nowrap" data-count="' + s.id + '">' +
    s.rows.length + " 天</span>" +
    '<button class="sec-del text-slate-400 hover:text-rose-500 flex-shrink-0 no-print" data-section="' + s.id + '" title="删除阶段">' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>' +
    "</button>" +
    "</div></td></tr>";

  // Data rows
  s.rows.forEach((row, ri) => {
    html +=
      '<tr>' +
      // Time cell: only show section name in first row, vertically centered
      '<td class="section-time" data-time-cell="' + s.id + '">' +
      (ri === 0 ? esc(s.name) : "") +
      "</td>" +
      row
        .slice(1)
        .map(
          (cell, ci) =>
            "<td>" +
            '<div class="editable" contenteditable="true" data-placeholder="—" ' +
            'data-section="' + s.id + '" data-row="' + ri + '" data-col="' + (ci + 1) + '">' +
            esc(cell) +
            "</div></td>"
        )
        .join("") +
      '<td class="w-10 no-print">' +
      '<button class="row-del row-action text-slate-300 hover:text-rose-500 mx-auto block" ' +
      'data-section="' + s.id + '" data-row="' + ri + '" title="删除行">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
      "</button></td>" +
      "</tr>";
  });

  // Add-row button
  html +=
    '<tr class="no-print"><td colspan="' + (colCount + 1) + '" class="bg-slate-50/50">' +
    '<button class="add-row w-full py-2 text-sm text-slate-500 hover:text-emerald-600 hover:bg-emerald-50 transition-colors" data-section="' + s.id + '">+ 添加一天</button>' +
    "</td></tr>";

  return html;
}

// ============================================================
// Editor events
// ============================================================
function bindEditorEvents() {
  const editor = document.getElementById("editor");

  // Plan name
  document.getElementById("plan-name").addEventListener("input", (e) => {
    updatePlan((p) => { p.name = e.target.value; });
    renderSidebar();
  });

  // Weights
  ["initial", "target", "final"].forEach((k) => {
    const el = document.getElementById("w-" + k);
    if (el) el.addEventListener("input", (e) => {
      updatePlan((p) => { p.weights[k] = e.target.value; });
    });
  });

  // Action buttons
  document.getElementById("btn-add-section").addEventListener("click", addSection);
  document.getElementById("btn-add-col").addEventListener("click", addColumn);
  document.getElementById("btn-remove-col").addEventListener("click", removeColumn);
  document.getElementById("btn-duplicate").addEventListener("click", duplicatePlan);

  // Section name (live update display)
  editor.querySelectorAll(".section-name").forEach((el) => {
    el.addEventListener("input", (e) => {
      const sid = el.dataset.section;
      const val = el.value;
      updatePlan((p) => {
        const s = p.sections.find((x) => x.id === sid);
        if (s) s.name = val;
      });
      // Live update time cell
      const tc = editor.querySelector('[data-time-cell="' + sid + '"]');
      if (tc) tc.textContent = val;
    });
  });

  // Editable cells (header + body)
  editor.querySelectorAll(".editable").forEach((el) => {
    // Strip HTML on paste to keep cells plain text
    el.addEventListener("paste", (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData("text");
      document.execCommand("insertText", false, text);
    });

    el.addEventListener("input", (e) => {
      const t = e.target;
      const val = t.innerText;
      if (t.dataset.type === "header") {
        const c = parseInt(t.dataset.col, 10);
        updatePlan((p) => { p.headers[c] = val; });
      } else if (t.dataset.section) {
        const sid = t.dataset.section;
        const ri = parseInt(t.dataset.row, 10);
        const ci = parseInt(t.dataset.col, 10);
        updatePlan((p) => {
          const s = p.sections.find((x) => x.id === sid);
          if (s && s.rows[ri]) s.rows[ri][ci] = val;
        });
      }
    });

    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.target.blur(); }
      if (e.key === "Escape") { e.preventDefault(); e.target.blur(); }
      if (e.key === "Tab") {
        e.preventDefault();
        const cells = Array.from(editor.querySelectorAll('.editable[contenteditable="true"]'));
        const idx = cells.indexOf(e.target);
        if (idx === -1) return;
        const next = e.shiftKey ? cells[idx - 1] : cells[idx + 1];
        if (next) next.focus();
      }
    });
  });

  // Section delete
  editor.querySelectorAll(".sec-del").forEach((el) => {
    el.addEventListener("click", () => deleteSection(el.dataset.section));
  });

  // Row delete
  editor.querySelectorAll(".row-del").forEach((el) => {
    el.addEventListener("click", () => deleteRow(el.dataset.section, parseInt(el.dataset.row, 10)));
  });

  // Add row
  editor.querySelectorAll(".add-row").forEach((el) => {
    el.addEventListener("click", () => addRow(el.dataset.section));
  });
}

// ============================================================
// Actions
// ============================================================
function createNewPlan() {
  const p = {
    id: uid(),
    name: "新建计划 " + (state.plans.length + 1),
    weights: { initial: "", target: "", final: "" },
    headers: ["时间", "早餐", "午餐", "晚餐", "喝水", "空腹体重", "睡前体重"],
    sections: [
      { id: uid(), name: "第1阶段", rows: [[ "", "", "", "", "", "", "" ], [ "", "", "", "", "", "", "" ], [ "", "", "", "", "", "", "" ]] },
    ],
  };
  state.plans.push(p);
  state.activePlanId = p.id;
  saveState();
  render();
  toast("已创建新计划");
}

function duplicatePlan() {
  const cur = activePlan();
  if (!cur) return;
  const copy = JSON.parse(JSON.stringify(cur));
  copy.id = uid();
  copy.name = cur.name + " 副本";
  copy.sections.forEach((s) => { s.id = uid(); });
  state.plans.push(copy);
  state.activePlanId = copy.id;
  saveState();
  render();
  toast("已复制为新计划");
}

function deletePlan(id) {
  if (state.plans.length === 1) { toast("至少保留一份计划"); return; }
  const p = state.plans.find((x) => x.id === id);
  if (!p) return;
  if (!confirm('确定删除「' + p.name + '」？此操作不可恢复。')) return;
  state.plans = state.plans.filter((x) => x.id !== id);
  if (state.activePlanId === id) state.activePlanId = state.plans[0].id;
  saveState(); render();
  toast("已删除");
}

function addSection() {
  updatePlan((p) => {
    const newSection = {
      id: uid(),
      name: "第" + (p.sections.length + 1) + "阶段",
      rows: Array(3).fill(null).map(() => Array(p.headers.length).fill("")),
    };
    p.sections.push(newSection);
  });
  render();
}

function addRow(sid) {
  updatePlan((p) => {
    const s = p.sections.find((x) => x.id === sid);
    if (s) s.rows.push(Array(p.headers.length).fill(""));
  });
  render();
}

function deleteRow(sid, ri) {
  if (!confirm("删除这一行？")) return;
  updatePlan((p) => {
    const s = p.sections.find((x) => x.id === sid);
    if (!s) return;
    if (s.rows.length > 1) s.rows.splice(ri, 1);
    else toast("至少保留一行，可改用删除阶段");
  });
  render();
}

function deleteSection(sid) {
  if (!confirm("删除整个阶段及其所有天数？")) return;
  updatePlan((p) => {
    p.sections = p.sections.filter((x) => x.id !== sid);
    if (p.sections.length === 0) {
      p.sections.push({
        id: uid(),
        name: "新阶段",
        rows: Array(3).fill(null).map(() => Array(p.headers.length).fill("")),
      });
    }
  });
  render();
}

function addColumn() {
  updatePlan((p) => {
    p.headers.push("新列");
    p.sections.forEach((s) => s.rows.forEach((r) => r.push("")));
  });
  render();
}

function removeColumn() {
  if (!confirm("删除最后一列？该列所有数据会一起删除。")) return;
  updatePlan((p) => {
    if (p.headers.length > 1) {
      p.headers.pop();
      p.sections.forEach((s) => s.rows.forEach((r) => r.pop()));
    } else toast("至少保留一列");
  });
  render();
}

function exportPlans() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "diet-plans-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("已导出 JSON");
}

function importPlans(e) {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = (ev) => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d && Array.isArray(d.plans) && d.plans.length) {
        if (!confirm("导入将替换当前所有计划，确定吗？")) return;
        state = d;
        saveState();
        render();
        toast("已导入 " + state.plans.length + " 份计划");
      } else { alert("文件格式无效：缺少 plans 数组"); }
    } catch (err) { alert("文件解析失败：" + err.message); }
  };
  r.readAsText(file);
  e.target.value = "";
}

// ============================================================
// Init
// ============================================================
document.getElementById("btn-new").addEventListener("click", createNewPlan);
document.getElementById("btn-import").addEventListener("click", () => document.getElementById("file-input").click());
document.getElementById("btn-export").addEventListener("click", exportPlans);
document.getElementById("btn-print").addEventListener("click", () => window.print());
document.getElementById("file-input").addEventListener("change", importPlans);

// Keyboard shortcut: Ctrl/Cmd + N for new plan
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "n" && !e.shiftKey) {
    if (document.activeElement && document.activeElement.isContentEditable) return;
    if (document.activeElement && /input|textarea/i.test(document.activeElement.tagName)) return;
    e.preventDefault();
    createNewPlan();
  }
});

loadState();
render();
</script>
</body>
</html>
